name: Check built Mac package
'on':
  workflow_dispatch:
    inputs:
      edition:
        description: Client edition
        required: true
        type: choice
        options:
        - operator
        - customer
        default: operator
      run-id:
        description: Build run containing the DMG artifact
        required: true
        type: string
      architecture:
        description: Mac CPU architecture
        required: true
        type: choice
        options:
        - x86_64
        - aarch64
        default: x86_64
      display-name:
        description: Expected localized name (empty for older packages)
        required: false
        type: string
        default: ''
      icon-sha256:
        description: Expected AppIcon.icns digest (empty for older packages)
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  check-package:
    runs-on: ${{ inputs.architecture == 'aarch64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 15
    env:
      VERIFY_EDITION: ${{ inputs.edition }}
      VERIFY_RUN_ID: ${{ inputs.run-id }}
      VERIFY_ARCH: ${{ inputs.architecture }}
      VERIFY_DISPLAY_NAME: ${{ inputs.display-name }}
      VERIFY_ICON_SHA256: ${{ inputs.icon-sha256 }}
    steps:
    - name: Checkout package verification helpers
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: Download built DMG
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ format('RustDesk-NAS-{0}1.5.1-macOS-{1}', inputs.edition == 'customer' && 'Customer-' || '', inputs.architecture)
          }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}
        path: packages
    - name: Launch packaged app with a fresh profile and read effective settings
      shell: bash
      run: |
        set -euo pipefail
        case "$VERIFY_EDITION" in
          operator) app_name=RustDesk ;;
          customer) app_name=RustDeskCustomer ;;
          *) exit 1 ;;
        esac
        [[ "$VERIFY_RUN_ID" =~ ^[0-9]+$ ]]
        packages=(packages/*.dmg)
        test "${#packages[@]}" -eq 1
        mount_point=$(mktemp -d)
        trap 'hdiutil detach "$mount_point" -force >/dev/null 2>&1 || true' EXIT
        hdiutil attach "${packages[0]}" -readonly -nobrowse -mountpoint "$mount_point" -quiet
        sudo ditto "$mount_point/$app_name.app" "/Applications/$app_name.app"
        qa_home=$(mktemp -d)/clean-home
        mkdir -p "$qa_home"
        binary="/Applications/$app_name.app/Contents/MacOS/$app_name"
        case "$VERIFY_ARCH" in
          aarch64) native_arch=arm64 ;;
          x86_64) native_arch=x86_64 ;;
          *) exit 1 ;;
        esac
        test "$(uname -m)" = "$native_arch"
        lipo "$binary" -verify_arch "$native_arch"
        lipo "/Applications/$app_name.app/Contents/Frameworks/liblibrustdesk.dylib" -verify_arch "$native_arch"
        branding_verified=false
        if [ -n "$VERIFY_DISPLAY_NAME" ]; then
          swift - "/Applications/$app_name.app" "$VERIFY_DISPLAY_NAME" <<'SWIFT'
        import Foundation
        let path = CommandLine.arguments[1]
        let expected = CommandLine.arguments[2]
        guard let bundle = Bundle(path: path),
              let name = bundle.localizedInfoDictionary?["CFBundleDisplayName"] as? String,
              name == expected else { fatalError("Unexpected localized bundle name") }
        let finderName = FileManager.default.displayName(atPath: path)
        precondition(finderName == expected || finderName == expected + ".app", finderName)
        print("Localized application name: " + name)
        SWIFT
          codesign --verify --deep --strict "/Applications/$app_name.app"
          [[ "$VERIFY_ICON_SHA256" =~ ^[a-f0-9]{64}$ ]]
          actual_icon_sha256=$(shasum -a 256 "/Applications/$app_name.app/Contents/Resources/AppIcon.icns" | awk '{print $1}')
          test "$actual_icon_sha256" = "$VERIFY_ICON_SHA256"
          python3 res/branding/verify_library.py "/Applications/$app_name.app/Contents/Frameworks/liblibrustdesk.dylib" --edition "$VERIFY_EDITION" --policy
          branding_verified=true
        fi
        run_client() { sudo env HOME="$qa_home" XDG_CONFIG_HOME="$qa_home/.config" "$binary" "$@"; }
        test "$(run_client --version)" = 1.5.1
        check_option() {
          actual=$(run_client --option "$1")
          if [ "$actual" != "$2" ]; then
            echo "::error::Unexpected $1: $actual"
            exit 1
          fi
        }
        check_option custom-rendezvous-server nas.hk-beautyshop.cn:21116
        check_option relay-server nas.hk-beautyshop.cn:21117
        check_option key GevVI6bnGZ79VB8CAJ9InRZ3o566YJDQZW5mTOCGri4=
        click_verified=false
        if [ "$VERIFY_EDITION" = customer ]; then
          check_option approve-mode click
          run_client --option approve-mode password
          check_option approve-mode click
          click_verified=true
        fi
        printf '{"edition":"%s","run_id":"%s","architecture":"%s","startup_verified":true,"fresh_profile_network_verified":true,"click_approval_verified":%s,"branding_verified":%s}\n' "$VERIFY_EDITION" "$VERIFY_RUN_ID" "$VERIFY_ARCH" "$click_verified" "$branding_verified" > macos-package-check.json
        cat macos-package-check.json
    - name: Save package startup verification
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: macOS-${{ inputs.edition }}${{ inputs.architecture == 'aarch64' && '-aarch64' || '' }}-startup-verification
        path: macos-package-check.json
        if-no-files-found: error
        retention-days: 7
